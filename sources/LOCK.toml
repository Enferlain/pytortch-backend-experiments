# The upstream revision each source last merged (git subtree --squash), and the fork whose
# main branch carries our changes on top of it. Update `revision` with every `git subtree pull`;
# `python -m cubecl_torch.compiler.source delta NAME` compares the source with it.

[cubecl]
upstream = "https://github.com/tracel-ai/cubecl"
revision = "15135eec624885ad05b145a722d5b2ba6cde2915"
fork = "https://github.com/enferlain/cubecl"

[cubek]
upstream = "https://github.com/tracel-ai/cubek"
revision = "74921bf416885d53b7196d5ed950bdf19488a21d"
fork = "https://github.com/enferlain/cubek"
