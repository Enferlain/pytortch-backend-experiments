# The runtime bridge: CubeCL's CUDA client and CubeK inside the torch process, on
# memory and streams PyTorch owns. Built by ../build.sh against the audited
# CubeCL checkout (pin + patch stack) and the pinned CubeK checkout.
[package]
name = "cubecl-torch-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# `cuda-cpp`: kernels go through CubeCL's C++ dialect and NVRTC, as descriptor
# kernels do. Without it cubecl-cuda compiles through its LLVM backend.
cubecl = { path = "../../../sources/cubecl/crates/cubecl", features = ["cuda", "cuda-cpp"] }
cubecl-common = { path = "../../../sources/cubecl/crates/cubecl-common" }
cubecl-environment = { path = "../../../sources/cubecl/crates/cubecl-environment" }
cubek-reduce = { path = "../../../sources/cubek/crates/cubek-reduce" }
# The calling thread's CUDA context, restored after each call. CubeCL's own
# requirement, so the same build of it.
cudarc = { version = "0.19.6", default-features = false, features = ["std", "driver"] }

# CubeK depends on CubeCL by git revision; build it against the audited checkout.
[patch."https://github.com/tracel-ai/cubecl"]
cubecl = { path = "../../../sources/cubecl/crates/cubecl" }
cubecl-common = { path = "../../../sources/cubecl/crates/cubecl-common" }
cubecl-environment = { path = "../../../sources/cubecl/crates/cubecl-environment" }
cubecl-ir = { path = "../../../sources/cubecl/crates/cubecl-ir" }

[workspace]
