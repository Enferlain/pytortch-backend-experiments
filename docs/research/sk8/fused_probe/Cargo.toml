[package]
name = "fused_probe"
version = "0.1.0"
edition = "2024"

# Our emitter (`cubecl_torch/native/src/{ir,semantic}.rs`) is compiled in unchanged through
# `#[path]` modules, so `native/` and its compiler binary are untouched.
[dependencies]
cubecl = { path = "../../../../.stage0-sources/cubecl/crates/cubecl", features = ["cuda", "cuda-cpp", "tile"] }
cubecl-core = { path = "../../../../.stage0-sources/cubecl/crates/cubecl-core" }
cubecl-cpp = { path = "../../../../.stage0-sources/cubecl/crates/cubecl-cpp", default-features = false, features = ["std", "cuda"] }
cubecl-runtime = { path = "../../../../.stage0-sources/cubecl/crates/cubecl-runtime" }
serde_json = "1"
pliron = "=0.19.0"

[workspace]
